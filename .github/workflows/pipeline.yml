# =============================================================================
# PIPELINE PRINCIPAL: CI (build + testes) -> CD (deploy na Vercel)
#   • Pull Request -> deploy de PREVIEW
#   • Push na main -> deploy de PRODUÇÃO
#
# Secrets necessários (Settings > Secrets and variables > Actions > aba "Secrets"):
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID
#   VERCEL_AUTOMATION_BYPASS_SECRET
#     (Vercel > Project Settings > Deployment Protection >
#      Protection Bypass for Automation)
#
# Atenção: PRs abertos pelo Dependabot NÃO recebem os secrets do Actions (eles
# usam um cofre separado, o "Dependabot secrets"). Por isso o deploy de preview
# é pulado para eles; o CI (testes + build) continua rodando normalmente.
# =============================================================================

name: Pipeline CI/CD - Vercel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Deploys da mesma branch entram em fila (sem cancelar o que já está rodando).
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # CI: testes, qualidade e build
  checks:
    name: Testes e build
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # PREVIEW: Pull Request
  preview:
    name: Deploy Preview
    needs: checks
    # Só PRs de dentro do próprio repositório (forks não recebem secrets) e que
    # não sejam do Dependabot (também não recebe secrets do Actions).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    environment:
      name: preview

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      # Lista TODOS os secrets vazios (não só o primeiro) e mostra quem disparou
      # a execução. Os valores nunca são impressos: só "configurado" ou "vazio".
      - name: Validar secrets da Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          faltando=0
          for nome in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!nome}" ]; then
              echo "::error::$nome está vazio"
              faltando=1
            else
              echo "✔ $nome configurado"
            fi
          done
          if [ "$faltando" -eq 1 ]; then
            echo "Disparado por: $ACTOR | evento: $EVENT | ambiente: preview"
            echo "Dica: se TODOS estiverem vazios, os secrets não estão chegando a esta execução"
            echo "(ator dependabot[bot], fork, repositório errado ou cadastrados na aba Variables)."
            exit 1
          fi

      - name: Baixar configurações do Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build do Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "### 🔍 Preview: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

      # Sobre o `vercel curl` (testado na CLI 64.5.0):
      #  - NÃO passe --token: a CLI repassa o flag ao curl ("option --token: is unknown").
      #  - VERCEL_TOKEN precisa estar no env, senão a CLI aborta ("No existing credentials found").
      #  - VERCEL_AUTOMATION_BYPASS_SECRET no env é lido pela CLI e enviado como header de bypass.
      #  - --fail faz o step falhar em HTTP 4xx/5xx.
      - name: Smoke test no Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          vercel curl "$DEPLOY_URL/api/health" --fail --silent --show-error

      - name: Comentar a URL no PR
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Preview pronto!**\n\n${process.env.DEPLOY_URL}\n\nCommit: \`${sha}\``
            });

  # ---------------------------------------------------------------------------
  # PRODUÇÃO: push na main
  production:
    name: Deploy Production
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      # Mesma validação do Preview (lista todos os secrets vazios, sem imprimir valores).
      - name: Validar secrets da Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          faltando=0
          for nome in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!nome}" ]; then
              echo "::error::$nome está vazio"
              faltando=1
            else
              echo "✔ $nome configurado"
            fi
          done
          if [ "$faltando" -eq 1 ]; then
            echo "Disparado por: $ACTOR | evento: $EVENT | ambiente: production"
            echo "Dica: se TODOS estiverem vazios, os secrets não estão chegando a esta execução"
            echo "(repositório errado ou cadastrados na aba Variables em vez de Secrets)."
            exit 1
          fi

      - name: Baixar configurações de Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build de Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Produção: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

      # Mesmas regras do smoke test do Preview: sem --token, com VERCEL_TOKEN e
      # VERCEL_AUTOMATION_BYPASS_SECRET no env, e --fail para falhar em HTTP 4xx/5xx.
      - name: Smoke test pós-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 5

          vercel curl "$DEPLOY_URL/api/health" --fail --silent --show-error

          vercel curl "$DEPLOY_URL/api/hello?name=Deploy" --fail --silent --show-error | grep -F "Olá, Deploy!"
